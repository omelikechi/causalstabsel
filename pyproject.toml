[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causalstabsel"
version = "0.1.0"
description = "Causal Stability Selection"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Omar Melikechi", email = "omar.melikechi@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "ipss>=1.1.11",
    "joblib",
    "numpy",
    "scikit-learn",
    "xgboost"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

keywords = ["causal inference", "feature selection", "stability selection", "machine learning", "IPSS"]

[project.urls]
Homepage = "https://github.com/omelikechi/causalstabsel"


